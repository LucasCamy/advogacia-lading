# Cloudlane Homelab · namespace landingpages · porta 8213
# Público: https://advocacia.cloudlane.com.br -> http://192.168.15.19:8213 (Cloudlane Tunnel)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advogacia-landing
  namespace: landingpages
  labels:
    app: advogacia-landing
  annotations:
    keel.sh/policy: "force"
    keel.sh/trigger: "poll"
    keel.sh/pollSchedule: "@every 1m"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: advogacia-landing
  template:
    metadata:
      labels:
        app: advogacia-landing
    spec:
      containers:
        - name: web
          image: ghcr.io/lucascamy/advogacia-lading:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: advogacia-landing
  namespace: landingpages
  labels:
    app: advogacia-landing
spec:
  type: LoadBalancer
  selector:
    app: advogacia-landing
  ports:
    - name: http
      port: 8213
      targetPort: 8080
      protocol: TCP
