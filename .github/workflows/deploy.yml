name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'k8s/**'
      - 'scripts/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Downcase Repository Name
        id: repo
        run: echo "NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.NAME }}:latest
            ghcr.io/${{ steps.repo.outputs.NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-k8s:
    name: Deploy to Kubernetes via Tailscale
    needs: build-and-push
    runs-on: ubuntu-latest
    # Mesmo padrão do repo Cloudlane. Requer os segredos TAILSCALE_AUTHKEY e KUBE_CONFIG neste repositório;
    # sem eles o job só avisa e o Keel continua como mecanismo de atualização.
    env:
      HAS_SECRETS: ${{ secrets.TAILSCALE_AUTHKEY != '' && secrets.KUBE_CONFIG != '' }}
    steps:
      - name: Verificar segredos
        if: env.HAS_SECRETS != 'true'
        run: echo "::warning::TAILSCALE_AUTHKEY/KUBE_CONFIG ausentes; deploy direto pulado (Keel segue responsável)."

      - name: Conectar à rede Tailscale
        if: env.HAS_SECRETS == 'true'
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurar Kubeconfig
        if: env.HAS_SECRETS == 'true'
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Atualizar Deployment no Kubernetes
        if: env.HAS_SECRETS == 'true'
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          kubectl set image deployment/advogacia-landing -n landingpages web="$IMAGE"
          kubectl rollout status deployment/advogacia-landing -n landingpages --timeout=120s
